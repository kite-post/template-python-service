[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "service-template"
version = "0.1.0"
description = "Шаблон Python-сервіса Kite"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.163",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    # starlette.testclient перейшов на httpx2; зі старим httpx він лає
    # попередженням про застарілість.
    "httpx2>=2.16",
    "ruff>=0.17",
    "mypy>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/service_template"]

# ── Лінт ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
src = ["src", "tests"]
# target-version не задаємо: ruff бере його з requires-python.

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-специфічні
]
ignore = [
    # Коментарі й докстрінги тут українською, тож «неоднозначний юнікод» —
    # це все кириличне письмо. Правило проти гомоглифів у ASCII-коді, не проти мови.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ── Типи ──────────────────────────────────────────────────────────────────────
[tool.mypy]
files = ["src", "tests"]
strict = true
warn_unused_configs = true
# FastAPI і Starlette типізовані, тож строгий режим тут не болить.

# ── Тести ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: тест, якому потрібні зовнішні сервіси (Testcontainers)",
]
