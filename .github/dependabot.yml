version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Версію kite-contracts піднімає workflow contracts-bump одразу після
      # релізу — одну на всі репозиторії (5.4, п. 6). Dependabot тут лише дублював би PR.
      - dependency-name: 'kite-contracts'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
